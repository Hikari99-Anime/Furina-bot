name: Fetch Furina Bot Logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Số dòng log gần nhất"
        required: false
        default: "150"

jobs:
  fetch-logs:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch pm2 logs from VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            pm2 logs furina-bot --lines ${{ github.event.inputs.lines }} --nostream
