name: Fetch Furina Bot Logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Số dòng pm2 log gần nhất"
        required: false
        default: "150"
      mode:
        description: "logs | diag | net | disable-ipv6 | enable-ipv6 | set-env | pm2 | nahida-diag | set-tokens | git-conflict-diag | git-resolve-keep-live"
        required: false
        default: "logs"
      env_line:
        description: "set-env: dòng KEY=VALUE để thêm/sửa trong .env"
        required: false
        default: ""

jobs:
  fetch-logs:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch from VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ "${{ github.event.inputs.mode }}" = "diag" ]; then
              cd /root/Furina-bot
              echo "--- df -h ---"
              df -h /
              echo "--- du -sh node_modules ---"
              du -sh node_modules 2>/dev/null
              echo "--- @discordjs/voice present? ---"
              ls -la node_modules/@discordjs/voice 2>&1 | head -5
              echo "--- @discordjs dir listing ---"
              ls -la node_modules/@discordjs 2>&1
              echo "--- package.json dependencies ---"
              cat package.json
              echo "--- git status ---"
              git status
              echo "--- git log -1 ---"
              git log -1 --oneline
              echo "--- node -e require check ---"
              node -e "console.log(require.resolve('@discordjs/voice'))" 2>&1
            elif [ "${{ github.event.inputs.mode }}" = "net" ]; then
              echo "--- DNS resolve discord.media ---"
              getent hosts discord.media || true
              echo "--- curl -v https://discord.media (port 443, base domain) ---"
              curl -vk --connect-timeout 6 https://discord.media 2>&1 | tail -40
              echo "--- curl -v https://discord.media:2096 (voice gateway alt port) ---"
              curl -vk --connect-timeout 6 https://discord.media:2096 2>&1 | tail -40
              echo "--- curl -v https://gateway.discord.gg (text gateway, control) ---"
              curl -vk --connect-timeout 6 https://gateway.discord.gg 2>&1 | tail -20
              echo "--- ufw status ---"
              (ufw status verbose || echo "ufw not active/installed") 2>&1
              echo "--- iptables OUTPUT rules ---"
              (iptables -L OUTPUT -n -v || echo "no iptables access") 2>&1
            elif [ "${{ github.event.inputs.mode }}" = "disable-ipv6" ]; then
              sysctl -w net.ipv6.conf.all.disable_ipv6=1
              sysctl -w net.ipv6.conf.default.disable_ipv6=1
              sysctl -w net.ipv6.conf.lo.disable_ipv6=1
              echo "IPv6 disabled at runtime (resets on reboot). Restarting bot to pick it up."
              pm2 restart furina-bot
            elif [ "${{ github.event.inputs.mode }}" = "enable-ipv6" ]; then
              sysctl -w net.ipv6.conf.all.disable_ipv6=0
              sysctl -w net.ipv6.conf.default.disable_ipv6=0
              sysctl -w net.ipv6.conf.lo.disable_ipv6=0
              echo "IPv6 re-enabled at runtime. Restarting bot to pick it up."
              pm2 restart furina-bot
            elif [ "${{ github.event.inputs.mode }}" = "set-env" ]; then
              cd /root/Furina-bot
              LINE='${{ github.event.inputs.env_line }}'
              KEY="${LINE%%=*}"
              if [ -z "$KEY" ] || [ "$KEY" = "$LINE" ]; then
                echo "env_line phải có dạng KEY=VALUE"
                exit 1
              fi
              touch .env
              if grep -q "^${KEY}=" .env; then
                sed -i "s|^${KEY}=.*|${LINE}|" .env
                echo "Updated .env key: $KEY"
              else
                echo "$LINE" >> .env
                echo "Added .env key: $KEY"
              fi
              pm2 restart furina-bot
            elif [ "${{ github.event.inputs.mode }}" = "pm2" ]; then
              echo "--- pm2 list ---"
              pm2 list
              echo "--- pm2 jlist (chi tiết) ---"
              pm2 jlist
              echo "--- ps aux | grep node ---"
              ps aux | grep -i node | grep -v grep
            elif [ "${{ github.event.inputs.mode }}" = "nahida-diag" ]; then
              echo "--- pm2 describe nahida-bot ---"
              pm2 describe nahida-bot
              echo "--- pm2 logs nahida-bot (error+out, 150 dòng) ---"
              pm2 logs nahida-bot --lines 150 --nostream
              echo "--- thư mục Nahida-bot ---"
              ls -la /root/Nahida-bot 2>&1
              echo "--- .env tồn tại? (không in nội dung) ---"
              ls -la /root/Nahida-bot/.env 2>&1
              echo "--- package.json ---"
              cat /root/Nahida-bot/package.json 2>&1
              echo "--- git status / log ---"
              cd /root/Nahida-bot && git status && git log -1 --oneline
              echo "--- thử restart để bắt lỗi khởi động ---"
              pm2 restart nahida-bot
              sleep 3
              pm2 logs nahida-bot --lines 40 --nostream
            elif [ "${{ github.event.inputs.mode }}" = "set-tokens" ]; then
              cd /root/Furina-bot
              touch .env
              if grep -q "^TOKEN=" .env; then
                sed -i "s|^TOKEN=.*|TOKEN=${{ secrets.FURINA_TOKEN }}|" .env
              else
                echo "TOKEN=${{ secrets.FURINA_TOKEN }}" >> .env
              fi
              echo "Updated Furina-bot TOKEN in .env"

              cd /root/Nahida-bot
              touch .env
              if grep -q "^DISCORD_TOKEN=" .env; then
                sed -i "s|^DISCORD_TOKEN=.*|DISCORD_TOKEN=${{ secrets.NAHIDA_TOKEN }}|" .env
              else
                echo "DISCORD_TOKEN=${{ secrets.NAHIDA_TOKEN }}" >> .env
              fi
              echo "Updated Nahida-bot DISCORD_TOKEN in .env"

              pm2 restart furina-bot
              pm2 restart nahida-bot
              sleep 4
              echo "--- pm2 list sau restart ---"
              pm2 list
              echo "--- nahida-bot log gần nhất (kiểm tra còn TokenInvalid không) ---"
              pm2 logs nahida-bot --lines 20 --nostream
              echo "--- furina-bot log gần nhất ---"
              pm2 logs furina-bot --lines 10 --nostream
            elif [ "${{ github.event.inputs.mode }}" = "git-conflict-diag" ]; then
              cd /root/Furina-bot
              echo "--- git status ---"
              git status
              echo "--- .git/MERGE_HEAD tồn tại? (stash pop conflict thường KHÔNG tạo cái này) ---"
              ls -la .git/MERGE_HEAD 2>&1 || echo "không có MERGE_HEAD"
              echo "--- git stash list ---"
              git stash list
              echo "--- HEAD commit (bản đã pull, phía sẽ là 'ours' trong xung đột) - data.json ---"
              git show HEAD:data.json 2>&1 | head -20
              echo "--- HEAD commit - noitu_state.json ---"
              git show HEAD:noitu_state.json 2>&1 | head -20
              echo "--- FILE HIỆN TẠI TRÊN DISK (có thể đang chứa conflict marker) - data.json ---"
              head -20 data.json
              echo "--- FILE HIỆN TẠI TRÊN DISK - noitu_state.json ---"
              head -20 noitu_state.json
              echo "--- so sánh kích thước file ---"
              wc -l data.json noitu_state.json
            elif [ "${{ github.event.inputs.mode }}" = "git-resolve-keep-live" ]; then
              cd /root/Furina-bot
              TS=$(date +%Y%m%d_%H%M%S)
              echo "--- backup data.json/noitu_state.json/giftcodes.json truoc khi dong ---"
              cp data.json /root/data.json.bak.$TS 2>&1
              cp noitu_state.json /root/noitu_state.json.bak.$TS 2>&1
              cp giftcodes.json /root/giftcodes.json.bak.$TS 2>&1
              echo "Backup luu tai /root/*.bak.$TS"

              echo "--- giu nguyen file dang co tren disk (live data), chi danh dau da resolve ---"
              git add data.json noitu_state.json giftcodes.json

              echo "--- commit de tree sach truoc khi pull ---"
              git commit -m "Sync runtime data (resolve stuck stash conflict)"

              echo "--- stash list (se bo qua, khong pop lai ban cu) ---"
              git stash list
              git stash drop 2>&1 || echo "khong co stash de drop"

              echo "--- git pull origin main ---"
              git pull origin main

              echo "--- git log -1 sau pull ---"
              git log -1 --oneline

              echo "--- git status cuoi cung ---"
              git status

              echo "--- npm install + pm2 restart ---"
              npm install
              pm2 restart furina-bot
            else
              pm2 logs furina-bot --lines ${{ github.event.inputs.lines }} --nostream
            fi
